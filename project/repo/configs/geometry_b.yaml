# PenumbraSight 几何冻结（B 档交付路径）
#
# 依据：PenumbraSight_影界_FPGA技术实现方案_2026-09-16
#   §4.1 坐标和初始几何 / §5.1 B 档默认尺寸 / §5.2 低秩模型存储
#   §6.4 定位引擎 / §8.1 model.psm 二进制格式
# 冻结日期：2026-09-26
# 状态：**数值已冻结，待实验台标定复核**（标称遮挡中心需现场对齐，见
#       occluder.nominal_center.calibrated）
#
# 与 configs/geometry_paper.yaml 的关系
# ---------------------------------------------------------------------------
# 本文件是**交付路径**的几何；geometry_paper.yaml 是**论文复现路径**的几何
# （D11 / 126 或 63 墙网格 / 29x36 隐藏网格 / 972 候选）。两者共用同一套物理
# 坐标约定（见下），只是采样密度与坐标系原点不同。方案 §11 阶段A 第 1 条要求
# 先用论文公开数据复现，所以两条路径都必须可跑。
version: 1
profile: b

# ---------------------------------------------------------------- 坐标约定
# 右手系：隐藏显示平面 y = 0，可见墙 y = D，x 水平，z 竖直（方案 §4.1）。
# 本 profile 的**原点取在隐藏显示平面中心**：
#     x、z 原点 = 显示面板中心；y 原点 = 显示平面
# 因此遮挡板与墙上的坐标都是「相对显示中心」的量，正负都有。
# 若现场对齐后发现显示中心与遮挡中心不重合，改 occluder.nominal_center，
# 不要改这里 —— 原点一旦改动，已生成的 model.psm 全部失效。
frame:
  origin: hidden_plane_center
  axes: {x: horizontal, y: depth_toward_wall, z: vertical}

# ---------------------------------------------------------------- 三平面距离
planes:
  hidden_y: 0.0            # 隐藏显示平面（方案 §4.1）
  occluder_y: 0.57         # 遮挡板-墙距离 0.46 -> 0.57（方案 §4.1）
  wall_y: 1.03             # D，显示器-墙距离（方案 §4.1，可调 0.8~1.2）

# ---------------------------------------------------------------- 墙网格
wall:
  n: 96                    # 96x96（方案 §5.1「分块 10x10 得到 96x96x3」）
  extent: [0.44, 0.44]     # 墙面有效视场 0.44x0.44 m（方案 §4.1）
  # 以原点为中心：x ∈ [-0.22, +0.22]，z ∈ [-0.22, +0.22]
  pitch: 0.004583333333333333   # = 0.44 / 96，便于核对，不参与计算
  layout: {rows: z, cols: x}    # 行索引对应 z、列索引对应 x（与 recon.hpp 一致）

# ---------------------------------------------------------------- 隐藏网格
hidden:
  n: [24, 18]              # [nx, nz] = 24x18 = 432（方案 §5.1）
  extent: [0.40, 0.30]     # 隐藏图像物理范围 0.40x0.30 m（方案 §4.1）
  pitch: [0.016666666666666666, 0.016666666666666666]   # = 0.40/24 = 0.30/18（逐向等距）
  layout: {rows: z, cols: x}
  # 扁平索引 = iz * nx + ix，与 model.psm 的 V 矩阵行序一致

# ---------------------------------------------------------------- 遮挡板
occluder:
  size: [0.075, 0.075]     # 75x75 mm（方案 §4.1，对照 50/75/100 mm）
  nominal_center:
    xyz: [0.0, 0.57, 0.0]  # 相对显示中心；现场对齐后填实测值
    calibrated: false      # **false = 尚未标定**。标定前生成的模型只可用于
                           # 通路联调，不可用于最终指标报告。
  # 论文原代码另有一根「独立立柱」（半宽 0.0035 m，z 从 0 到遮挡板下沿），
  # 与矩形阴影用 OR 合并。X4h 已逐行解码，见 forward_model.stick。

# ---------------------------------------------------------------- 候选网格
# 方案 §5.1：x 方向 ±40 mm、10 mm 步长；墙向距离 ±40 mm、10 mm 步长；
#            z 方向 -20/0/+20 mm  ->  9 x 9 x 3 = 243
candidates:
  n: [9, 9, 3]             # [nx, ny, nz]
  pitch: [0.010, 0.010, 0.020]
  span: [0.040, 0.040, 0.020]      # 半幅（nx=9 时 8*10/2 = 40 mm）
  layout: {rows: z, cols: x}       # 定位分数曲面的形状 (nx, ny, nz)
  # 最佳候选周围用三点抛物线插值得到亚网格显示值，但**重建仍选最近的预计算
  # 模型**（方案 §5.1 原话），不在线重新建模。

# ---------------------------------------------------------------- 秩与迭代
ranks:
  loc_rank: 8              # K：定位只读前 8 列（方案 §5.1、§6.4）
  recon_rank_default: 64   # R：默认 64，可切 32/48/64（方案 §5.1）
  recon_rank_max: 64       # 96 需独立模型（方案 §5.1）
  recon_iter_default: 16   # 外层迭代 12 或 16，最大 32（方案 §5.1）

# ---------------------------------------------------------------- 前向模型口径
# 这一节是 X4h/X4l 的产物：定位链与重建链在论文里是**两套不同的前向模型**，
# 此处把差异点全部显式化，默认值取「X4l 实测对实测图像拟合更好的那一侧」，
# 论文原代码口径的取值同时记录在注释里，供报告分栏对照。
forward_model:
  # 显示器视角因子的 z 配对方式（x4h §3 第 6 条）
  #   direct   = 视角因子直接用升序墙网格 z
  #   mirrored = 论文原代码口径（内部用降序 FOV 网格），x4h 记作「z 镜像」
  # X4l 实测：direct 在未差分/差分两域、bu/mushroom 两场景共 4 组拟合上全部
  # 改善（未差分残差 0.1133->0.0911 / 0.1250->0.0895），方案口径定位从
  # 0.1081/0.0529 改善到 0.0438/0.0438。故默认 direct。
  # 注意：这不是符号翻转 —— cos(arctan(t))^20 = (1+t^2)^-10 对 t 是偶函数，
  # 改的是「显示器 z 与墙 z 的配对方式」，机制未定，报告里要如实写。
  view_factor_z_pairing: direct      # direct | mirrored
  # 块 -> 显示器 x 序号是否反向（论文原代码为反向，源码注释称其为文件命名约定）
  # 该开关**对定位判据零影响**（列置换不变性，X4l §4.4 已证明），保留只为复现。
  block_monitor_x_order: reversed    # reversed | normal
  stick: true                        # 是否加那根独立立柱
  view_angle: true                   # 是否启用显示器视角因子（X4l 实测必须开）
  # 整屏全局离散的采样密度 N（方案 table_S1 口径：全局轮 2、x/y 精细轮 1、y 轮 10）
  monitor_discr_n: {global: 2, refine_xy: 1, refine_y: 10}
  # 辐射项：定位链论文口径为 D^2/d^6（重建链为 y^2/d^4），保持论文口径
  radiation_term: D2_over_d6

# ---------------------------------------------------------------- 哈希
# model.psm 头部 geometry_hash 的算法：对本文件
#   planes + wall + hidden + occluder.size + occluder.nominal_center.xyz
#   + forward_model 中影响 A 的字段（view_factor_z_pairing, block_monitor_x_order,
#     stick, view_angle, monitor_discr_n, radiation_term）
# 按固定的 ASCII 规范串做 CRC32（见 psm.py build_geometry_hash）。
# 任何一项改动都会换哈希，从而触发方案 §6.6 的「模型几何哈希与当前配置不一致
# -> 强制灰屏」保护。
geometry_hash_scope: [planes, wall, hidden, occluder.size, occluder.nominal_center,
                      forward_model]

notes:
  - 物理场景与论文一致（同一套 0.44x0.44 墙面视场、75~77 mm 遮挡板、D=1.03 m），
    差别只在采样密度：墙 96（论文 126）、隐藏 24x18（论文 36x29）、候选 243
    （论文第 1 轮 972）。因此论文复现路径与交付路径可以共用同一套解码器。
  - 「候选 972」是论文第 1 轮的 18x18x3，不是交付口径；交付口径为 9x9x3=243。
  - 定位计算量按方案 §5.3：243 x 9120 x 8 x 3 ≈ 53.2 M MAC，目标 <= 100 ms。
  - 隐藏网格布局与墙网格布局都取「行 = z、列 = x」，与 recon.hpp 的布局约定
    以及 V 矩阵的行序一致；导出脚本已按「mon_x 只随列变、mon_z 只随行变」
    逐值核对过（X1 接口冻结）。
